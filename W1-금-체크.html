<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[W1-금] 체크</title>
<style>
  :root {
    color-scheme: light;
    font-family: Arial, "Malgun Gothic", sans-serif;
    color: #171717;
    background: #f6f6f5;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 12px 16px 32px;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 22px;
    font-weight: 400;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 18px;
    line-height: 1.65;
  }

  th,
  td {
    padding: 14px 18px;
    border-bottom: 1px solid #dededb;
    text-align: left;
    vertical-align: top;
    overflow-wrap: anywhere;
  }

  thead {
    background: #fff;
  }

  th {
    font-weight: 700;
  }

  th:first-child,
  td:first-child {
    width: 16%;
  }

  th:nth-child(2),
  td:nth-child(2) {
    width: 10%;
  }

  code {
    padding: 2px 8px;
    border: 1px solid #dededb;
    border-radius: 8px;
    background: #fafaf9;
    font: 0.9em Consolas, "Courier New", monospace;
    white-space: normal;
  }

  a {
    color: inherit;
  }

  @media (max-width: 620px) {
    body {
      padding: 12px 10px 24px;
    }

    h1 {
      font-size: 19px;
    }

    table {
      font-size: 15px;
    }

    th,
    td {
      padding: 11px 8px;
    }

    th:first-child,
    td:first-child {
      width: 24%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 18%;
    }

    td:nth-child(2) {
      white-space: nowrap;
    }
  }
</style>
</head>
<body>
<main>
  <h1>[W1-금] 체크 — 통과 5 · 미흡 0 · 확인 불가 0</h1>
  <table>
    <thead>
      <tr>
        <th scope="col">항목</th>
        <th scope="col">결과</th>
        <th scope="col">근거</th>
      </tr>
    </thead>
    <tbody>
      <tr>

        <td>통과</td>
        <td><code>gam-test</code> 저장소에 Git 이력이 있습니다.</td>
      </tr>
      <tr>

        <td>통과</td>
        <td><code>git remote -v</code> 에 <code>origin</code> 원격 저장소가 등록되어 있습니다.</td>
      </tr>
      <tr>
        <td>포트폴리오 첫 칸</td>
        <td>통과</td>
        <td>제공된 캡처에서 1주차 《감 테스트》 카드와 판단 기록을 확인했습니다.</td>
      </tr>
      <tr>
        <td>링크</td>
        <td>통과</td>
        <td><a href="https://gam-test-rfqy.vercel.app/">감 테스트 배포 링크</a>가 열리고 문항과 결과 화면이 동작합니다.</td>
      </tr>
      <tr>
        <td>폰에서 열리는가</td>

  </table>

</html>
