<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 900">
  <!-- 첫 화면 배경 — 시안3 의 출근길을 웹툰 그림체(굵은 선 · 단색 칠)로 그린 것 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebccb"/>
      <stop offset="1" stop-color="#e3e9ee"/>
    </linearGradient>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="2.5" y="3" width="9" height="12" fill="#d7e3ee" stroke="#23262d" stroke-width=".8"/>
      <path d="M3 3l8 12" stroke="#ffffff" stroke-width="1.2" opacity=".55"/>
    </pattern>
    <pattern id="winD" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="2.5" y="3" width="9" height="12" fill="#8fa3b8" stroke="#23262d" stroke-width=".8"/>
    </pattern>
    <!-- 정장 차림 -->
    <g id="suit">
      <rect x="-9" y="40" width="7" height="34" rx="2" fill="#1f2638" stroke="#15171c" stroke-width="1.5"/>
      <rect x="2" y="40" width="7" height="34" rx="2" fill="#1f2638" stroke="#15171c" stroke-width="1.5"/>
      <path d="M-11 74h9M2 74h9" stroke="#15171c" stroke-width="3" stroke-linecap="round"/>
      <rect x="-13" y="6" width="26" height="38" rx="6" fill="#2b3550" stroke="#15171c" stroke-width="2"/>
      <path d="M-5 6l5 12 5-12z" fill="#f3f5f8" stroke="#15171c" stroke-width="1"/>
      <path d="M0 9l-2 9 2 4 2-4z" fill="#3b4f8f"/>
      <circle cx="0" cy="-6" r="10" fill="#f2cfb0" stroke="#15171c" stroke-width="2"/>
      <path d="M-10 -7a10 10 0 0 1 20 0q-5-5-10-3.5q-6-1.5-10 3.5z" fill="#1b1d22"/>
    </g>
    <!-- 셔츠 차림 + 서류가방 -->
    <g id="shirt">
      <rect x="-9" y="40" width="7" height="34" rx="2" fill="#2a2f3d" stroke="#15171c" stroke-width="1.5"/>
      <rect x="2" y="40" width="7" height="34" rx="2" fill="#2a2f3d" stroke="#15171c" stroke-width="1.5"/>
      <path d="M-11 74h9M2 74h9" stroke="#15171c" stroke-width="3" stroke-linecap="round"/>
      <rect x="-13" y="6" width="26" height="36" rx="6" fill="#c3d6ee" stroke="#15171c" stroke-width="2"/>
      <path d="M0 8l-2 10 2 4 2-4z" fill="#2b3550"/>
      <rect x="12" y="30" width="14" height="11" rx="2" fill="#2a2420" stroke="#15171c" stroke-width="1.5"/>
      <circle cx="0" cy="-6" r="10" fill="#f2cfb0" stroke="#15171c" stroke-width="2"/>
      <path d="M-10 -7a10 10 0 0 1 20 0q-5-5-10-3.5q-6-1.5-10 3.5z" fill="#1b1d22"/>
    </g>
    <!-- 긴 머리 · 베이지 재킷 -->
    <g id="coat">
      <rect x="-8" y="40" width="6" height="34" rx="2" fill="#20232b" stroke="#15171c" stroke-width="1.5"/>
      <rect x="2" y="40" width="6" height="34" rx="2" fill="#20232b" stroke="#15171c" stroke-width="1.5"/>
      <path d="M-10 74h8M2 74h8" stroke="#15171c" stroke-width="3" stroke-linecap="round"/>
      <rect x="-13" y="6" width="26" height="38" rx="6" fill="#d8c3a2" stroke="#15171c" stroke-width="2"/>
      <path d="M-4 6l4 10 4-10z" fill="#f6f2ea" stroke="#15171c" stroke-width="1"/>
      <path d="M-11 -6q0-15 11-15t11 15v14h-5v-12h-12v12h-5z" fill="#2a211d" stroke="#15171c" stroke-width="1.5"/>
      <circle cx="0" cy="-6" r="9" fill="#f4d4b8" stroke="#15171c" stroke-width="2"/>
      <path d="M-9 -8q4-8 9-8t9 8q-5-3-9-3t-9 3z" fill="#2a211d"/>
    </g>
    <g id="tree">
      <rect x="-3" y="10" width="6" height="40" fill="#5b4433" stroke="#23262d" stroke-width="1.5"/>
      <circle cx="-14" cy="0" r="18" fill="#6f9a55" stroke="#23262d" stroke-width="2"/>
      <circle cx="14" cy="-2" r="18" fill="#6f9a55" stroke="#23262d" stroke-width="2"/>
      <circle cx="0" cy="-16" r="20" fill="#7fab62" stroke="#23262d" stroke-width="2"/>
      <circle cx="-6" cy="-20" r="7" fill="#9cc47c"/>
    </g>
  </defs>

  <!-- 하늘 · 구름 -->
  <rect width="460" height="560" fill="url(#sky)"/>
  <g fill="#f4f7fa" stroke="#9aa8b6" stroke-width="1.5">
    <path d="M40 70q0-16 18-16q6-12 22-8q14-6 22 8q16 0 16 16z"/>
    <path d="M300 48q0-12 14-12q6-10 18-6q12-4 18 6q12 0 12 12z"/>
  </g>

  <!-- 먼 빌딩 -->
  <g stroke="#23262d" stroke-width="2.5">
    <rect x="186" y="200" width="46" height="360" fill="#c5ced8"/>
    <rect x="232" y="170" width="48" height="390" fill="#bcc6d1"/>
  </g>
  <g>
    <rect x="190" y="210" width="38" height="340" fill="url(#win)" opacity=".7"/>
    <rect x="236" y="180" width="40" height="370" fill="url(#win)" opacity=".7"/>
  </g>

  <!-- 가까운 빌딩 — 오른쪽 면은 그늘 -->
  <g stroke="#23262d" stroke-width="2.5">
    <rect x="-6" y="120" width="96" height="440" fill="#a9b6c4"/>
    <rect x="94" y="56" width="88" height="504" fill="#b7c2ce"/>
    <rect x="282" y="88" width="80" height="472" fill="#b2bdca"/>
    <rect x="364" y="28" width="102" height="532" fill="#a3b1c0"/>
  </g>
  <g>
    <rect x="2" y="132" width="76" height="420" fill="url(#win)"/>
    <rect x="102" y="68" width="70" height="484" fill="url(#winD)"/>
    <rect x="290" y="100" width="62" height="452" fill="url(#win)"/>
    <rect x="372" y="40" width="84" height="512" fill="url(#winD)"/>
  </g>
  <g fill="#000" opacity=".13">
    <rect x="76" y="121" width="13" height="438"/>
    <rect x="168" y="57" width="13" height="502"/>
    <rect x="348" y="89" width="13" height="470"/>
  </g>
  <g stroke="#23262d" stroke-width="2.5" fill="none">
    <path d="M94 56h88M364 28h102"/>
  </g>

  <!-- 가로수 -->
  <use href="#tree" transform="translate(150 455)"/>
  <use href="#tree" transform="translate(262 460) scale(.9)"/>
  <use href="#tree" transform="translate(20 450) scale(1.1)"/>

  <!-- 버스 -->
  <g stroke="#23262d" stroke-width="2.5">
    <rect x="-20" y="440" width="128" height="78" rx="8" fill="#3f71b8"/>
    <rect x="-12" y="452" width="112" height="28" rx="3" fill="#cfe0f2"/>
    <circle cx="10" cy="520" r="11" fill="#2a2d33"/>
    <circle cx="82" cy="520" r="11" fill="#2a2d33"/>
  </g>
  <path d="M30 452v28M65 452v28" stroke="#23262d" stroke-width="2"/>

  <!-- 지하철 입구 -->
  <g stroke="#23262d" stroke-width="2.5">
    <rect x="318" y="430" width="150" height="100" fill="#6d7682"/>
    <rect x="318" y="410" width="150" height="26" fill="#3a3f47"/>
    <rect x="336" y="452" width="132" height="78" fill="#2a2e35"/>
  </g>
  <path d="M340 470h128M340 490h128M340 510h128" stroke="#f0e6c8" stroke-width="2" opacity=".55"/>
  <text x="352" y="428" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">지하철</text>
  <circle cx="412" cy="423" r="9" fill="#33a23d" stroke="#ffffff" stroke-width="1.5"/>
  <text x="412" y="428" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>

  <!-- 보도 · 횡단보도 · 점자블록 -->
  <rect y="530" width="460" height="370" fill="#c9c8c2" stroke="#23262d" stroke-width="2.5"/>
  <g fill="#f4f3ee" stroke="#23262d" stroke-width="1.5">
    <rect x="-10" y="590" width="480" height="18"/>
    <rect x="-10" y="626" width="480" height="18"/>
    <rect x="-10" y="662" width="480" height="18"/>
    <rect x="-10" y="698" width="480" height="18"/>
  </g>
  <rect x="404" y="530" width="30" height="370" fill="#e3b93e" stroke="#23262d" stroke-width="2"/>
  <path d="M410 545h18M410 565h18M410 585h18M410 605h18M410 625h18M410 645h18M410 665h18M410 685h18M410 705h18M410 725h18M410 745h18M410 765h18M410 785h18M410 805h18M410 825h18M410 845h18M410 865h18M410 885h18" stroke="#b98f22" stroke-width="2"/>
  <path d="M0 760h400" stroke="#a9a8a2" stroke-width="2"/>
  <path d="M0 830h400" stroke="#a9a8a2" stroke-width="2"/>

  <!-- 출근하는 사람들 — 멀수록 작게 -->
  <use href="#suit"  transform="translate(120 492) scale(.55)"/>
  <use href="#shirt" transform="translate(205 488) scale(.5)"/>
  <use href="#suit"  transform="translate(250 494) scale(.55)"/>
  <use href="#coat"  transform="translate(300 492) scale(.55)"/>
  <use href="#suit"  transform="translate(175 520) scale(.75)"/>
  <use href="#shirt" transform="translate(330 528) scale(.8)"/>
  <use href="#coat"  transform="translate(92 548) scale(.95)"/>
  <use href="#suit"  transform="translate(44 610) scale(1.45)"/>
  <use href="#shirt" transform="translate(408 600) scale(1.5)"/>
  <use href="#coat"  transform="translate(372 700) scale(1.2)"/>
  <use href="#suit"  transform="translate(24 760) scale(1.7)"/>
</svg>
